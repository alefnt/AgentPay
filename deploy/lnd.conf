# LND Configuration for AgentPay Cch
# Lightning Network Daemon — Neutrino mode (no local bitcoind needed)

[Application Options]
# Listen for gRPC (used by Fiber Cch)
rpclisten=0.0.0.0:10009
restlisten=0.0.0.0:8080
listen=0.0.0.0:9735
# Allow connections from Docker containers
tlsextraip=0.0.0.0
tlsextradomain=lnd
# Logging
debuglevel=info
# Auto-create wallet (for testnet/signet dev)
noseedbackup=true

[Bitcoin]
bitcoin.active=true
bitcoin.signet=true
bitcoin.node=neutrino

[Neutrino]
# Multiple signet Neutrino peers for reliability
neutrino.addpeer=seed.signet.bitcoin.sprovoost.nl
neutrino.addpeer=signet-electrumx.wakiyamap.dev
neutrino.addpeer=v7ajjeirttkbnt32wpy3c6w3emwnfr3fkla7hpxclrhw42wrtr35lyd.onion
neutrino.feeurl=https://nodes.lightning.computer/fees/v1/btc-fee-estimates.json
