# LND Configuration for AgentPay Cch
# Lightning Network Daemon — connects to Bitcoin signet

[Application Options]
# Listen for gRPC (used by Fiber Cch)
rpclisten=0.0.0.0:10009
restlisten=0.0.0.0:8080
listen=0.0.0.0:9735
# Allow external connections
tlsextraip=0.0.0.0
tlsextradomain=lnd
# Logging
debuglevel=info

[Bitcoin]
bitcoin.active=1
bitcoin.signet=1
bitcoin.node=bitcoind

[Bitcoind]
bitcoind.rpchost=bitcoind:18443
bitcoind.rpcuser=agentpay
bitcoind.rpcpass=agentpay_dev
bitcoind.zmqpubrawblock=tcp://bitcoind:28332
bitcoind.zmqpubrawtx=tcp://bitcoind:28333
