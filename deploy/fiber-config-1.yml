# Fiber Node 1 Configuration (Provider Agent + Cch Hub)
# See: https://github.com/nervosnetwork/fiber

[fiber]
listening_port = 8119
rpc_listening_addr = "0.0.0.0:8227"
announce_listening_addr = true

# CKB connection
[ckb]
rpc_url = "${CKB_RPC_URL}"
udt_whitelist = []

# Storage
[store]
path = "/data/fiber-1"

# Network
[network]
bootnode_addrs = []

# ─── Cross-Chain Hub (BTC Lightning ↔ Fiber) ───────────
# Connects this Fiber node to a Lightning Network node (LND)
# enabling BTC ↔ CKB atomic swaps via Cch
[cch]
# LND gRPC endpoint (inside Docker network)
lnd_rpc_url = "https://lnd:10009"
# LND TLS certificate (shared via Docker volume)
lnd_cert_path = "/lnd/tls.cert"
# LND admin macaroon (shared via Docker volume)
lnd_macaroon_path = "/lnd/data/chain/bitcoin/signet/admin.macaroon"
