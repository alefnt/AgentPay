# AgentPay — Docker Deployment
#
# Services:
#   fiber-node-1:   Fiber Network node (Provider) + Cch cross-chain hub
#   fiber-node-2:   Fiber Network node (Caller)
#   lnd:            Lightning Network node (BTC signet, Neutrino mode)
#   provider-agent: Translation service Provider
#   x402:           x402 Facilitator (bridges x402 ↔ Fiber)
#
# Quick start (Fiber only):
#   docker compose up fiber-node-1 -d
#
# Full stack (BTC Lightning ↔ Fiber):
#   docker compose up lnd fiber-node-1 -d
#
# BTC Lightning ↔ Fiber flow:
#   BTC Agent (Lightning) → LND → Cch (fiber-node-1) → Fiber → CKB Agent

services:
  # ─── Lightning Network Node (LND + Neutrino) ───────────
  # No local bitcoind needed — uses Neutrino lightweight sync
  lnd:
    image: lightninglabs/lnd:v0.18.0-beta
    container_name: agentpay-lnd
    volumes:
      - lnd-data:/root/.lnd
      - ./deploy/lnd.conf:/root/.lnd/lnd.conf:ro
    ports:
      - "9735:9735"     # P2P
      - "10009:10009"   # gRPC
      - "8080:8080"     # REST
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "lncli", "--network=signet", "getinfo"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ─── Fiber Node 1 (Provider + Cch Hub) ─────────────────
  # Uses official FNN v0.7.1 binary
  # Cch connects to LND for BTC Lightning ↔ Fiber atomic swaps
  fiber-node-1:
    build:
      context: .
      dockerfile: deploy/Dockerfile.fiber
    container_name: agentpay-fiber-1
    depends_on:
      lnd:
        condition: service_healthy
    ports:
      - "8227:8227"    # RPC
      - "8228:8228"    # P2P
    volumes:
      - fiber1-data:/app/data
      - lnd-data:/lnd:ro    # Share LND certs/macaroons for Cch
    environment:
      - RUST_LOG=info
      - FIBER_SECRET_KEY_PASSWORD=agentpay_dev_2025
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8227"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Fiber Node 2 (Caller) ──────────────────────────────
  fiber-node-2:
    build:
      context: .
      dockerfile: deploy/Dockerfile.fiber
    container_name: agentpay-fiber-2
    ports:
      - "8229:8227"    # RPC (different host port)
      - "8230:8228"    # P2P
    volumes:
      - fiber2-data:/app/data
    environment:
      - RUST_LOG=info
      - FIBER_SECRET_KEY_PASSWORD=agentpay_dev_2025
    restart: unless-stopped

  # ─── Provider Agent (Translation) ──────────────────────
  provider-agent:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: provider
    container_name: agentpay-provider
    ports:
      - "3001:3001"
    environment:
      - FIBER_RPC_URL=http://fiber-node-1:8227
      - PORT=3001
    depends_on:
      fiber-node-1:
        condition: service_healthy
    restart: unless-stopped

  # ─── x402 Facilitator ──────────────────────────────────
  x402-facilitator:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: x402
    container_name: agentpay-x402
    ports:
      - "4020:4020"
    environment:
      - FIBER_RPC_URL=http://fiber-node-1:8227
      - PORT=4020
    depends_on:
      fiber-node-1:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lnd-data:
  fiber1-data:
  fiber2-data:
