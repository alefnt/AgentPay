# AgentPay — Docker Deployment
#
# Services:
#   fiber-node-1:   Fiber Network node (Provider Agent) + Cch cross-chain hub
#   fiber-node-2:   Fiber Network node (Caller Agent)
#   lnd:            Lightning Network node (BTC testnet) for Cch
#   bitcoind:       Bitcoin testnet node (LND backend)
#   provider-agent: Translation service Provider
#   x402:           x402 Facilitator (bridges x402 ↔ Fiber)
#
# Usage:
#   docker compose up -d
#
# BTC Lightning ↔ Fiber flow:
#   BTC Agent (Lightning) → LND → Cch (fiber-node-1) → Fiber → CKB Agent

version: '3.8'

services:
  # ─── Bitcoin Testnet Node ───────────────────────────────
  bitcoind:
    image: btcpayserver/bitcoin:27.0
    container_name: agentpay-bitcoind
    environment:
      BITCOIN_NETWORK: signet
    volumes:
      - bitcoind-data:/data
      - ./deploy/bitcoin.conf:/data/bitcoin.conf:ro
    ports:
      - "18443:18443"   # RPC
      - "38333:38333"   # P2P (signet)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-signet", "getblockchaininfo"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Lightning Network Node (LND) ──────────────────────
  lnd:
    image: lightninglabs/lnd:v0.18.0-beta
    container_name: agentpay-lnd
    depends_on:
      bitcoind:
        condition: service_healthy
    volumes:
      - lnd-data:/root/.lnd
      - ./deploy/lnd.conf:/root/.lnd/lnd.conf:ro
    ports:
      - "9735:9735"     # P2P
      - "10009:10009"   # gRPC
      - "8080:8080"     # REST
    environment:
      - NETWORK=signet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "lncli", "--network=signet", "getinfo"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Fiber Node 1 (Provider + Cch Hub) ─────────────────
  fiber-node-1:
    image: nervosnetwork/fiber:latest
    container_name: agentpay-fiber-1
    depends_on:
      lnd:
        condition: service_healthy
    ports:
      - "8227:8227"    # RPC
      - "8119:8119"    # P2P
    volumes:
      - fiber1-data:/data
      - lnd-data:/lnd:ro    # Share LND certs/macaroons for Cch
      - ./deploy/fiber-config-1.yml:/config.yml:ro
    environment:
      - RUST_LOG=info
      - CKB_RPC_URL=${CKB_RPC_URL:-https://testnet.ckb.dev}
    command: ["fnn", "-c", "/config.yml"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8227"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Fiber Node 2 (Caller) ──────────────────────────────
  fiber-node-2:
    image: nervosnetwork/fiber:latest
    container_name: agentpay-fiber-2
    ports:
      - "8228:8227"    # RPC (different host port)
      - "8120:8119"    # P2P
    volumes:
      - fiber2-data:/data
      - ./deploy/fiber-config-2.yml:/config.yml:ro
    environment:
      - RUST_LOG=info
      - CKB_RPC_URL=${CKB_RPC_URL:-https://testnet.ckb.dev}
    command: ["fnn", "-c", "/config.yml"]
    restart: unless-stopped

  # ─── Provider Agent (Translation) ──────────────────────
  provider-agent:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: provider
    container_name: agentpay-provider
    ports:
      - "3001:3001"
    environment:
      - FIBER_RPC_URL=http://fiber-node-1:8227
      - PORT=3001
    depends_on:
      fiber-node-1:
        condition: service_healthy
    restart: unless-stopped

  # ─── x402 Facilitator ──────────────────────────────────
  x402-facilitator:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: x402
    container_name: agentpay-x402
    ports:
      - "4020:4020"
    environment:
      - FIBER_RPC_URL=http://fiber-node-1:8227
      - PORT=4020
    depends_on:
      fiber-node-1:
        condition: service_healthy
    restart: unless-stopped

volumes:
  bitcoind-data:
  lnd-data:
  fiber1-data:
  fiber2-data:
